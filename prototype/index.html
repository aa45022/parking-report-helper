<title>違停檢舉助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=Overpass:wght@600;800&family=Overpass+Mono:wght@600;700&display=swap">
<style>
/* 版面：單欄手機工具。三種外觀（路標、夜巡、小綠人）共用同一套結構，只換色彩、字體、形狀與細節。
   每種外觀都刻意只有一種明暗：路標、小綠人是亮色，夜巡是深色；第一次使用會依手機的深色模式挑選。 */
:root {
  /* A 路標（預設） */
  --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #E8ECF1; --ink: #0E1A2B; --muted: #5B6676; --line: #DCE1E8;
  --accent: #0A58A8; --accent-ink: #FFFFFF; --accent-soft: #E2ECF7; --accent-text: #0A58A8;
  --ok: #157A4A; --ok-soft: #E2F2E9; --warn: #8A5A00; --warn-soft: #FBEFD6; --no: #C4262E; --no-soft: #FBE6E7;
  --plate-bg: #FFFFFF; --plate-ink: #111111; --stripe-a: #F7F8FA; --stripe-b: #1F242B;
  --count-bg: transparent; --count-ink: var(--ink); --count-urgent: #C4262E;
  --font-body: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Sans TC", "PingFang TC", "Heiti TC", system-ui, sans-serif;
  --display-weight: 900;
  --font-num: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --radius: 16px; --radius-lg: 22px; --btn-radius: 16px;
  color-scheme: light;
}
:root[data-skin="night"] {
  --bg: #111418; --surface: #1A1F25; --surface-2: #232A31; --ink: #EEF1F4; --muted: #9AA4AF; --line: #2C343D;
  --accent: #FFD23F; --accent-ink: #111418; --accent-soft: #2E2A16; --accent-text: #FFD23F;
  --ok: #4FC58C; --ok-soft: #13301F; --warn: #FFB547; --warn-soft: #33270F; --no: #FF6B5E; --no-soft: #3A1618;
  --plate-bg: #F4F5F6; --plate-ink: #111111; --stripe-a: rgba(255,255,255,0.08); --stripe-b: transparent;
  --count-bg: transparent; --count-ink: #FFD23F; --count-urgent: #FF6B5E;
  --font-num: "Overpass Mono", "Overpass", ui-monospace, monospace;
  --radius: 18px; --radius-lg: 24px; --btn-radius: 16px;
  color-scheme: dark;
}
:root[data-skin="green"] {
  --bg: #F2F6F3; --surface: #FFFFFF; --surface-2: #E6EFE9; --ink: #10302A; --muted: #5A6E68; --line: #D5E2D9;
  --accent: #16955A; --accent-ink: #FFFFFF; --accent-soft: #DDF0E5; --accent-text: #13804D;
  --ok: #13804D; --ok-soft: #DDF0E5; --warn: #9A5F06; --warn-soft: #FBEFD6; --no: #C4262E; --no-soft: #FBE6E7;
  --plate-bg: #FFFFFF; --plate-ink: #111111; --stripe-a: #FFFFFF; --stripe-b: #E7EFE9;
  --count-bg: #1B1F1D; --count-ink: #3FD08A; --count-urgent: #F2A21B;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --display-weight: 400;
  --radius: 20px; --radius-lg: 28px; --btn-radius: 999px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; display: flex; flex-direction: column; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.disp { font-family: var(--font-display); font-weight: var(--display-weight); }
.num { font-family: var(--font-num); font-weight: 800; font-variant-numeric: tabular-nums; }
:root[data-skin="night"] .num { font-weight: 700; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 380px) { .grid2 { grid-template-columns: 1fr; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 頂部：品牌與分頁 */
.top { background: var(--surface); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px 12px; }
.mark { width: 42px; height: 42px; flex: none; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
:root[data-skin="night"] .mark { border-radius: 9px; width: 32px; height: 32px; background: repeating-linear-gradient(135deg, #FFD23F 0 6px, #111418 6px 11px); }
:root[data-skin="night"] .mark svg { display: none; }
:root[data-skin="green"] .mark { border-radius: 14px; }
.brand { display: grid; flex-grow: 1; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 20px; letter-spacing: 0.02em; line-height: 1.3; }
.brand span { font-size: 12px; color: var(--muted); }
.zebra { height: 14px; border-top: 5px solid var(--stripe-b); border-bottom: 5px solid var(--stripe-b); background: repeating-linear-gradient(90deg, var(--stripe-a) 0 24px, var(--stripe-b) 24px 44px); }
:root[data-skin="night"] .zebra { display: none; }
:root[data-skin="green"] .zebra { height: 10px; border: 0; background-color: var(--stripe-b); background-image: linear-gradient(90deg, var(--stripe-a) 2px, transparent 2px); background-size: 22px 10px; }
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 4px; }
.tabbar button { border: 0; background: transparent; min-height: 52px; display: grid; justify-items: center; align-content: center; font-size: 12px; color: var(--muted); cursor: pointer; border-radius: 12px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-selected="true"] { color: var(--accent-text); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); border-radius: 0; }
:root[data-skin="night"] .tabbar { background: #15191E; }
:root[data-skin="green"] .tabbar { background: var(--bg); border-bottom: 0; }
:root[data-skin="green"] .tabbar .wrap { background: var(--surface); border-radius: 999px; padding: 6px; margin-block: 6px; }
:root[data-skin="green"] .tabbar button { border-radius: 999px; min-height: 48px; }
:root[data-skin="green"] .tabbar button[aria-selected="true"] { box-shadow: none; background: var(--accent-soft); border-radius: 999px; }

main { padding-block: 18px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
.page-title { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 24px; line-height: 1.3; text-wrap: balance; }
.sec-title { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 17px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.flat { background: transparent; padding: 0; }
.card > h3 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h4 { margin: 0; font-size: 15px; }

/* 按鈕 */
.btn { min-height: 48px; padding: 10px 18px; border-radius: var(--btn-radius); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent-text); }
.btn.danger { color: var(--no); border-color: var(--no); background: transparent; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: min(var(--btn-radius), 12px); }
:root[data-skin="green"] .btn.small { border-radius: 999px; }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 18px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.iconbtn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
:root[data-skin="green"] .iconbtn { border-radius: 50%; border: 0; }

/* 首頁主按鈕：三種外觀各自的形狀 */
.cta { display: grid; gap: 12px; }
.cta-hero { display: none; }
.cta-btn { border: 0; cursor: pointer; text-align: left; font-family: inherit; border-radius: var(--radius-lg); background: var(--accent); color: var(--accent-ink); padding: 20px; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 14px; align-items: center; }
.cta-icon { grid-row: 1 / 3; width: 56px; height: 56px; border-radius: 50%; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; }
.cta-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 30px; line-height: 1.2; letter-spacing: 0.04em; }
.cta-sub { font-size: 14px; opacity: 0.85; }
.cta-arrow { grid-row: 1 / 3; grid-column: 3; }
.cta-alt { min-height: 52px; }
.cta-note { margin: 0; text-align: center; }
:root[data-skin="night"] .cta-note { position: relative; }
:root[data-skin="green"] .cta-note { margin: -6px 18px 16px; }
:root[data-skin="night"] .cta { justify-items: center; padding-block: 10px; position: relative; }
:root[data-skin="night"] .cta::before { content: ""; position: absolute; left: -16px; right: -16px; top: 40px; height: 150px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0 30px, transparent 30px 56px); }
:root[data-skin="night"] .cta-btn { position: relative; background: transparent; color: var(--ink); grid-template-columns: 1fr; text-align: center; justify-items: center; padding: 0; row-gap: 10px; }
:root[data-skin="night"] .cta-icon { grid-row: auto; width: 164px; height: 164px; border: 6px solid var(--accent); background: var(--bg); padding: 10px; color: #111418; position: relative; }
:root[data-skin="night"] .cta-icon::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #F4F5F6; }
:root[data-skin="night"] .cta-icon svg { position: relative; width: 52px; height: 52px; }
:root[data-skin="night"] .cta-title { font-size: 24px; }
:root[data-skin="night"] .cta-arrow { display: none; }
:root[data-skin="night"] .cta-alt { position: relative; background: transparent; border: 0; color: var(--muted); font-weight: 500; min-height: 44px; }
:root[data-skin="green"] .cta { background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; gap: 0; }
:root[data-skin="green"] .cta-hero { display: grid; place-items: center; height: 120px; background-color: var(--stripe-b); background-image: linear-gradient(var(--stripe-a) 2px, transparent 2px), linear-gradient(90deg, var(--stripe-a) 2px, transparent 2px); background-size: 34px 34px; }
:root[data-skin="green"] .cta-hero span { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); color: #FFFFFF; display: grid; place-items: center; }
:root[data-skin="green"] .cta-btn { margin: 18px 18px 8px; border-radius: 999px; grid-template-columns: auto auto; justify-content: center; padding: 16px 20px; column-gap: 10px; }
:root[data-skin="green"] .cta-icon { width: auto; height: auto; background: transparent; color: #FFFFFF; grid-row: 1; }
:root[data-skin="green"] .cta-title { font-size: 22px; }
:root[data-skin="green"] .cta-sub, :root[data-skin="green"] .cta-arrow { display: none; }
:root[data-skin="green"] .cta-alt { margin: 0 18px 14px; border: 0; background: transparent; color: var(--accent-text); font-weight: 500; }

/* 倒數 */
.count { display: inline-flex; align-items: baseline; gap: 2px; color: var(--count-ink); }
.count .n { font-family: var(--font-num); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.count .u { font-size: 13px; font-weight: 700; }
.count.urgent { color: var(--count-urgent); }
:root[data-skin="road"] .count, :root:not([data-skin]) .count { color: var(--ink); }
:root[data-skin="road"] .count.urgent, :root:not([data-skin]) .count.urgent { color: var(--no); }
:root[data-skin="green"] .count { flex-direction: column; align-items: center; justify-content: center; gap: 0; width: 58px; height: 58px; border-radius: 14px; background: var(--count-bg); }
:root[data-skin="green"] .count .n { font-size: 26px; }
:root[data-skin="green"] .count .u { font-size: 10px; font-weight: 500; }
.daybar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.daybar span { height: 6px; border-radius: 3px; background: var(--surface-2); }
.daybar span.on { background: var(--accent); }
.daybar.urgent span.on { background: var(--no); }

/* 卡片、清單 */
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.dcard { flex: none; width: 250px; scroll-snap-align: start; background: var(--surface); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; border: 0; text-align: left; cursor: pointer; color: var(--ink); font-family: inherit; }
.dcard .place { font-size: 14px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 10px 4px; display: grid; justify-items: center; }
.stat b { font-family: var(--font-num); font-weight: 800; font-size: 28px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.note { border-radius: 14px; padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; background: var(--surface); }
.note b { font-size: 15px; }
.note.ok { background: var(--ok-soft); } .note.ok b { color: var(--ok); }
.note.no { background: var(--no-soft); } .note.no b { color: var(--no); }
.note.warn { background: var(--warn-soft); } .note.warn b { color: var(--warn); }
.note.info { background: var(--accent-soft); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.no { background: var(--no-soft); color: var(--no); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--surface-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.plate { display: inline-flex; align-items: center; justify-content: center; padding: 1px 10px; background: var(--plate-bg); color: var(--plate-ink); border: 2.5px solid var(--plate-ink); border-radius: 6px; font-family: "Overpass", sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; line-height: 1.35; white-space: nowrap; }
.plate.lg { font-size: 28px; border-width: 3px; padding: 2px 12px; }
.plate.sm { font-size: 16px; padding: 0 7px; border-width: 2px; }
.plate.empty { border-style: dashed; color: var(--muted); background: transparent; border-color: var(--line); font-family: var(--font-body); font-size: 15px; letter-spacing: 0; font-weight: 500; }
.tip { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; }
.tip .ic { width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.setup { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; }
.setup .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--accent-ink); }
.setup .dot.on { background: var(--ok); border-color: var(--ok); color: #FFFFFF; }

/* 檢舉流程 */
.flowhead { display: grid; gap: 10px; }
.flowhead .top-line { display: flex; align-items: center; gap: 10px; }
.flowhead .label { display: grid; flex-grow: 1; line-height: 1.3; }
.flowhead .label small { font-size: 12px; color: var(--muted); }
.flowhead .label b { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 18px; }
.segs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.segs button { height: 6px; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer; }
.segs button.done { background: var(--ok); }
.segs button.now { background: var(--accent); }
.qtitle { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 22px; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { min-height: 120px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 8px; padding: 12px 8px; color: var(--ink); font-family: inherit; }
.tile .pic { width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
:root[data-skin="night"] .tile .pic { background: var(--surface-2); color: var(--accent); }
:root[data-skin="green"] .tile .pic { border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); }
.tile .pic.no { background: var(--no-soft); color: var(--no); }
.tile b { font-size: 17px; }
.tile small { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4; }
.answered { display: flex; flex-wrap: wrap; gap: 8px; }
.answered button { border: 0; border-radius: 999px; background: var(--surface); padding: 6px 12px; font-size: 14px; cursor: pointer; color: var(--ink); }
.answered button span { color: var(--muted); }
.verdict { border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.verdict .vic { grid-row: 1 / 4; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; }
.verdict b { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 20px; }
.verdict p { margin: 0; font-size: 14px; }
.verdict.ok { background: var(--ok-soft); } .verdict.ok .vic { background: var(--ok); } .verdict.ok b { color: var(--ok); }
.verdict.warn { background: var(--warn-soft); } .verdict.warn .vic { background: var(--warn); } .verdict.warn b { color: var(--warn); }
.verdict.no { background: var(--no-soft); } .verdict.no .vic { background: var(--no); } .verdict.no b { color: var(--no); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.slot { display: grid; gap: 6px; min-width: 0; }
.slot .frame { position: relative; height: 150px; border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 2px dashed var(--line); display: grid; place-items: center; cursor: pointer; color: var(--muted); font-family: inherit; padding: 0; width: 100%; }
.slot .frame.next { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }
.slot .frame.filled { border: 0; background: var(--surface-2); cursor: default; }
.slot .frame img { width: 100%; height: 100%; object-fit: cover; }
.slot .frame .inner { display: grid; justify-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
.slot .badge { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--ok); color: #FFFFFF; display: grid; place-items: center; }
.slot .rm { position: absolute; top: 6px; left: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(0,0,0,0.55); color: #FFFFFF; display: grid; place-items: center; cursor: pointer; }
.slot .cap { font-size: 15px; font-weight: 700; }
.slot .cap small { font-weight: 400; font-size: 13px; color: var(--muted); }
.ring { position: relative; width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; }
.ring .face { width: 84px; height: 84px; border-radius: 50%; background: var(--surface); display: grid; justify-items: center; align-content: center; }
.ring .face b { font-family: var(--font-num); font-weight: 800; font-size: 24px; line-height: 1; color: var(--ink); }
.ring .face small { font-size: 11px; color: var(--muted); }
:root[data-skin="green"] .ring { border-radius: 16px; width: 100px; height: 80px; background: #1B1F1D !important; }
:root[data-skin="green"] .ring .face { background: transparent; }
:root[data-skin="green"] .ring .face b { color: #F2A21B; }
:root[data-skin="green"] .ring .face small { color: #F2A21B; }
.infolist { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }

async function readMeta(file) {
  const out = { takenAt: null, timeSource: null, offset: null, lat: null, lng: null, make: '', model: '', width: null, height: null, exif: false, gpsTag: false, error: null };
  try {
    if (!window.ExifReader) throw new Error('ExifReader 沒有載入');

    const ex = tags.exif || {};
    const dto = (ex.DateTimeOriginal || ex.DateTimeDigitized || ex.DateTime || {}).description;
    const m = dto && dto.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
    if (m) { out.takenAt = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`; out.timeSource = 'exif'; }
    out.offset = (ex.OffsetTimeOriginal || ex.OffsetTime || {}).description || null;
    const gps = tags.gps || {};
    if (typeof gps.Latitude === 'number' && typeof gps.Longitude === 'number' && !(gps.Latitude === 0 && gps.Longitude === 0)) { out.lat = gps.Latitude; out.lng = gps.Longitude; }
    out.make = (ex.Make || {}).description || '';
    out.exif = !!(m || out.make);
    out.gpsTag = !!(ex.GPSLatitude || ex.GPSLongitude);
    out.model = (ex.Model || {}).description || '';
    out.width = (ex.PixelXDimension || {}).value || null;
    out.height = (ex.PixelYDimension || {}).value || null;
  } catch (e) { out.error = String(e && e.message || e); }
  if (!out.takenAt && file.lastModified) {
    const s = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date(file.lastModified));
    out.takenAt = s.replace(' ', 'T'); out.timeSource = 'file';
  }
  return out;
}
function loadImgEl(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => res({ src: img, w: img.naturalWidth, h: img.naturalHeight, done: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法解碼圖片')); };
    img.src = url;
  });
}
async function decode(file) {
  try { const b = await createImageBitmap(file, { imageOrientation: 'from-image' }); return { src: b, w: b.width, h: b.height, done: () => b.close && b.close() }; }
  catch (e) { return loadImgEl(file); }
}
async function renderScaled(file, maxSide) {
  const d = await decode(file);
  const scale = Math.min(1, maxSide / Math.max(d.w, d.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(d.w * scale)); c.height = Math.max(1, Math.round(d.h * scale));
  c.getContext('2d').drawImage(d.src, 0, 0, c.width, c.height);
  d.done();
  return c;
}

  const base = a.place === 'sidewalk' ? 'sidewalk' : 'crosswalk';

/* ================= 照片存放：App 自己的資料庫（IndexedDB） =================
 * 照片原檔只存在這支手機、這個 App 的資料庫，不會進手機相簿，也不會上傳。
 * 存成 ArrayBuffer（比 Blob 相容性好）。資料庫打不開時（例如私密瀏覽），照片只留在記憶體。 */
const PhotoDB = {
  p: null,
  open() {
    if (this.p) return this.p;
    this.p = new Promise(res => {
      try {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open('prh-photos', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('photos')) r.result.createObjectStore('photos', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return this.p;
  },
  async run(mode, fn) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => {
      try {
        const t = db.transaction('photos', mode), req = fn(t.objectStore('photos'));
        t.oncomplete = () => res(req && 'result' in req ? (req.result === undefined ? true : req.result) : true);
        t.onerror = t.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  },
  put(rec) { return this.run('readwrite', s => s.put(rec)); },
  get(id) { return this.run('readonly', s => s.get(id)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); },

};

  } catch (e) { return false; }

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  let offset = 0;
  for (const e of entries) {
    const data = new Uint8Array(await e.blob.arrayBuffer()), name = enc.encode(e.name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(10, time, true); h.setUint16(12, date, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(h, name, data);

    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(ch, name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((a, x) => a + x.byteLength, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true); end.setUint32(12, size, true); end.setUint32(16, offset, true);

}

 * 用隱私密碼經 PBKDF2（60 萬次）產生金鑰，再用 AES-GCM 加密個人資料。
 * 手機裡只存加密後的內容；密碼和金鑰都不會儲存，只在解鎖期間留在記憶體。 */

}

}

}

}

/* Face ID／指紋支援檢查：只讀取瀏覽器回報的能力，不建立、也不儲存任何東西 */

(async function boot() {
  render();

      S.sampleImgMax = (lim && lim.images && lim.images.maxCount) || 0;
