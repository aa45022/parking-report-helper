<title>違停檢舉助手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：單欄手機工具。上方品牌列加斑馬線色帶，下面是固定在上方的分頁列；檢舉流程一步一個畫面 */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #15202b;
  --muted: #5a6674;
  --line: #d5dbe3;
  --blue: #1d5bab;      /* 指示標誌藍：主要動作 */
  --blue-soft: #e4edf8;
  --blue-ink: #ffffff;
  --red: #c4262e;       /* 禁制標誌紅：不能檢舉、刪除 */
  --ok: #1d7a4e;
  --ok-bg: #e3f3ea;
  --warn: #9a5b00;
  --warn-bg: #fbf0dc;
  --no-bg: #fbe6e7;
  --stripe: #15202b;
  --plate-bg: #ffffff;
  --plate-ink: #111111;
  --font-body: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #17202a; --surface-2: #1d2833; --ink: #e7ecf1; --muted: #98a4b1; --line: #2b3744;
    --blue: #6aa6ef; --blue-soft: #1a2b40; --blue-ink: #0b1826; --red: #f0646b; --ok: #4fc58c; --ok-bg: #12301f; --warn: #e2a640; --warn-bg: #33270f; --no-bg: #3a1618;
    --stripe: #e7ecf1; --plate-bg: #f4f4f0; --plate-ink: #111111; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #17202a; --surface-2: #1d2833; --ink: #e7ecf1; --muted: #98a4b1; --line: #2b3744;
  --blue: #6aa6ef; --blue-soft: #1a2b40; --blue-ink: #0b1826; --red: #f0646b; --ok: #4fc58c; --ok-bg: #12301f; --warn: #e2a640; --warn-bg: #33270f; --no-bg: #3a1618;
  --stripe: #e7ecf1; --plate-bg: #f4f4f0; --plate-ink: #111111; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; display: flex; flex-direction: column; min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { background: var(--surface); }
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; }
.top h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.02em; }
.badge { font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.zebra { height: 8px; background: repeating-linear-gradient(90deg, var(--stripe) 0 22px, transparent 22px 40px); opacity: 0.85; }
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: transparent; padding: 6px 2px 8px; min-height: 54px; display: grid; justify-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-selected="true"] { color: var(--blue); font-weight: 700; box-shadow: inset 0 -3px 0 var(--blue); }

main { padding-block: 16px calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
h2.page { margin: 0; font-size: 22px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h4 { margin: 0; font-size: 15px; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

.btn { min-height: 46px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); text-align: center; }
.btn.primary { background: var(--blue); color: var(--blue-ink); border-color: var(--blue); font-weight: 700; }
.btn.danger { color: var(--red); border-color: var(--red); background: transparent; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn.cta { width: 100%; min-height: 92px; font-size: 24px; border-radius: 18px; letter-spacing: 0.04em; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.no { background: var(--no-bg); color: var(--red); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.auto { background: var(--blue-soft); color: var(--blue); }

.note { border-radius: 12px; padding: 10px 12px; font-size: 14px; display: grid; gap: 4px; }
.note b { font-size: 15px; }
.note.ok { background: var(--ok-bg); } .note.ok b { color: var(--ok); }
.note.no { background: var(--no-bg); } .note.no b { color: var(--red); }
.note.warn { background: var(--warn-bg); } .note.warn b { color: var(--warn); }
.note.info { background: var(--surface-2); border: 1px dashed var(--line); }

/* 進度 */
.progress { display: grid; gap: 8px; }
.progress .label { font-size: 14px; color: var(--muted); }
.progress .label b { color: var(--ink); font-size: 17px; }
.dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.dots button { height: 8px; border: 0; padding: 0; border-radius: 4px; background: var(--line); cursor: pointer; }
.dots button.done { background: var(--ok); }
.dots button.now { background: var(--blue); }
.stepnav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }

/* 第 1 步的大按鈕問題 */
.bigq { display: grid; gap: 10px; }
.bigq > .qtitle { font-size: 20px; font-weight: 700; }
.bigq button.choice { min-height: 64px; font-size: 19px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; padding: 10px 16px; display: grid; gap: 2px; }
.bigq button.choice small { font-size: 13px; color: var(--muted); font-weight: 400; }
.answered { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.answered span { color: var(--muted); font-size: 14px; }

/* 照片 */
.checklist { display: grid; gap: 8px; }
.checkitem { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; }
.checkitem .box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--blue-ink); }
.checkitem .box.on { background: var(--ok); border-color: var(--ok); }
.checkitem small { display: block; color: var(--muted); font-size: 13px; }
.photos { display: grid; gap: 10px; }
.photo { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: start; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.photo img, .photo .noimg { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; background: var(--line); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.photo .meta { display: grid; gap: 4px; min-width: 0; font-size: 13px; }
.photo select { font-size: 14px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 22px; line-height: 1; padding: 4px 6px; min-width: 40px; min-height: 40px; }
.timer { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.timer .clock { font-family: var(--font-num); font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.timer .clock.done { color: var(--ok); }

/* 表單 */
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lbl { font-size: 14px; font-weight: 500; }
.field input, .field select, .field textarea { display: block; width: 100%; max-width: 100%; min-width: 0; min-height: 46px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.field input[type="date"], .field input[type="time"] { -webkit-appearance: none; appearance: none; text-align: left; }
.field textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.field .sub { font-size: 13px; color: var(--muted); }
.field .sub.bad { color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; text-align: left; }
.chip small { color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.plate { display: inline-flex; align-items: center; justify-content: center; min-width: 120px; padding: 2px 12px; background: var(--plate-bg); color: var(--plate-ink); border: 2px solid var(--plate-ink); border-radius: 6px; font-family: var(--font-num); font-weight: 700; font-size: 24px; letter-spacing: 0.08em; line-height: 1.3; }
.plate.sm { min-width: 0; font-size: 18px; padding: 0 8px; }
.cands { display: flex; flex-wrap: wrap; gap: 10px; }
.cand { border: 0; background: transparent; padding: 0; cursor: pointer; display: grid; gap: 2px; justify-items: center; font-size: 12px; color: var(--muted); }
.cand[aria-pressed="true"] .plate { outline: 3px solid var(--blue); outline-offset: 2px; }
.checks { display: grid; gap: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--ok); }
.check small { color: var(--muted); }
.deadline { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.deadline .big { font-family: var(--font-num); font-size: 32px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.deadline.urgent .big { color: var(--red); }
dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; }

/* 送出 */
.copylist { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.copyrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface); }
.copyrow:first-child { border-top: 0; }
.copyrow > div { min-width: 0; display: grid; gap: 2px; }
.copyrow .k { font-size: 13px; color: var(--muted); }
.copyrow .v { font-size: 15px; font-weight: 500; word-break: break-all; }
.copyrow .v.empty { color: var(--red); font-weight: 400; }
.copyrow .n { font-size: 12px; color: var(--muted); }
ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
ol.steps li { padding-left: 4px; }
ol.steps li > .row { margin-top: 6px; }
details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; list-style-position: inside; }
details > div { padding: 0 14px 14px; display: grid; gap: 10px; }
.focusbox { display: grid; gap: 14px; }
.focusbox .count { font-family: var(--font-num); font-size: 18px; color: var(--muted); }
.focusbox .flabel { font-size: 18px; font-weight: 700; }
.focusbox .fvalue { font-size: 26px; font-weight: 700; word-break: break-all; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); min-height: 64px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--blue); }

/* 首頁與紀錄 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; display: grid; justify-items: center; gap: 0; }
.stat b { font-family: var(--font-num); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.todo { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.todo:first-of-type { border-top: 0; }
.todo .t { display: grid; gap: 2px; min-width: 0; }
.todo .place { font-size: 13px; color: var(--muted); }
.setup { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
.setup .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--blue-ink); }
.setup .dot.on { background: var(--ok); border-color: var(--ok); }
.menu { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.menu button { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 14px 16px; cursor: pointer; min-height: 60px; }
.menu button:first-child { border-top: 0; }
.menu button span small { display: block; font-size: 13px; color: var(--muted); }
.menu button .arrow { color: var(--muted); font-size: 20px; }
.case { display: grid; gap: 6px; }
.case .place { font-size: 14px; color: var(--muted); }
.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 14px; }
.barrow .bar { grid-column: 1 / -1; }
.answer { white-space: pre-wrap; font-size: 15px; background: var(--surface-2); border-radius: 12px; padding: 12px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; white-space: nowrap; }
.guide { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; }
.guide svg { width: 64px; height: 64px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 8; max-width: calc(100% - 32px); }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 500; }
</style>

<header class="top">
  <div class="wrap">
    <h1>違停檢舉助手</h1>
    <span class="badge">測試版 v0.2.1</span>
  </div>
  <div class="zebra" aria-hidden="true"></div>
</header>
<nav class="tabbar" role="tablist" aria-label="主要功能">
  <div class="wrap">
    <button role="tab" data-view="home" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>首頁</button>

<script src="https://cdn.jsdelivr.net/npm/exifreader@4.46.0/dist/exif-reader.js"></script>
<script>
'use strict';

/* ================= 基本工具 ================= */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const K = { profile: 'prh.profile.v1', cases: 'prh.cases.v1', places: 'prh.places.v1', settings: 'prh.settings.v1' };
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2000);
}
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) { const o = btn.textContent; btn.textContent = '已複製'; setTimeout(() => { if (btn.isConnected) btn.textContent = o; }, 1400); }
    else toast('已複製');
    return true;
  } catch (e) { toast('無法自動複製，請長按文字自己複製'); return false; }
}
function todayTaipei() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date()); }
function nowTaipei() {
  const s = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
  const m = s.match(/(\d{4})-(\d{2})-(\d{2}),?\s*(\d{2}):(\d{2})/);
  return m ? { date: `${m[1]}-${m[2]}-${m[3]}`, time: `${m[4] === '24' ? '00' : m[4]}:${m[5]}` } : { date: todayTaipei(), time: '' };
}
function addDays(ymd, n) { const [y, m, d] = ymd.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); }
function dayDiff(a, b) { const pa = a.split('-').map(Number), pb = b.split('-').map(Number); return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000); }
function fmtDate(ymd) { if (!ymd) return ''; const [y, m, d] = ymd.split('-'); return `${y}/${m}/${d}`; }
function shortDate(ymd) { if (!ymd) return ''; const [, m, d] = ymd.split('-'); return `${Number(m)}/${Number(d)}`; }
function minutesBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 60000); }

const ID_LETTERS = { A: 10, B: 11, C: 12, D: 13, E: 14, F: 15, G: 16, H: 17, I: 34, J: 18, K: 19, L: 20, M: 21, N: 22, O: 35, P: 23, Q: 24, R: 25, S: 26, T: 27, U: 28, V: 29, W: 32, X: 30, Y: 31, Z: 33 };
function checkId(raw) {
  const s = (raw || '').trim().toUpperCase();

  if (!/^[A-Z][1289]\d{8}$/.test(s)) return { ok: false, msg: '格式應為 1 個英文字母加 9 個數字' };
  const n = ID_LETTERS[s[0]], w = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1, 1];
  const digits = [Math.floor(n / 10), n % 10, ...s.slice(1).split('').map(Number)];
  return digits.reduce((a, d, i) => a + d * w[i], 0) % 10 === 0 ? { ok: true, msg: '檢核碼正確' } : { ok: false, msg: '檢核碼不對，請再核對一次' };
}
function normPlate(raw) {

}

function inRing(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function inPolygon(pt, poly) { if (!inRing(pt, poly[0])) return false; for (let k = 1; k < poly.length; k++) if (inRing(pt, poly[k])) return false; return true; }
async function loadTowns() { if (!S.data.towns) { try { S.data.towns = await (await fetch('data/taiwan_towns.geojson')).json(); } catch (e) {} } return S.data.towns; }
function locateTown(lat, lng) {
  const fc = S.data.towns; if (!fc) return null;
  const pt = [lng, lat];
  for (const f of fc.features) {
    const g = f.geometry; if (!g) continue;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    if (polys.some(p => inPolygon(pt, p))) return { county: f.properties.COUNTYNAME, town: f.properties.TOWNNAME };
  }
  return null;
}
function distM(a, b) {
  const R = 6371000, toR = x => x * Math.PI / 180;
  const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function readMeta(file) {
  const out = { takenAt: null, timeSource: null, offset: null, lat: null, lng: null, make: '', model: '', width: null, height: null, error: null };
  try {
    if (!window.ExifReader) throw new Error('ExifReader 沒有載入');
    const tags = ExifReader.load(await file.arrayBuffer(), { expanded: true });
    const ex = tags.exif || {};
    const dto = (ex.DateTimeOriginal || ex.DateTimeDigitized || ex.DateTime || {}).description;
    const m = dto && dto.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
    if (m) { out.takenAt = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}`; out.timeSource = 'exif'; }
    out.offset = (ex.OffsetTimeOriginal || ex.OffsetTime || {}).description || null;
    const gps = tags.gps || {};
    if (typeof gps.Latitude === 'number' && typeof gps.Longitude === 'number' && !(gps.Latitude === 0 && gps.Longitude === 0)) { out.lat = gps.Latitude; out.lng = gps.Longitude; }
    out.make = (ex.Make || {}).description || '';
    out.model = (ex.Model || {}).description || '';
    out.width = (ex.PixelXDimension || {}).value || null;
    out.height = (ex.PixelYDimension || {}).value || null;
  } catch (e) { out.error = String(e && e.message || e); }
  if (!out.takenAt && file.lastModified) {
    const s = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(new Date(file.lastModified));
    out.takenAt = s.replace(' ', 'T'); out.timeSource = 'file';
  }
  return out;
}
function loadImgEl(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => res({ src: img, w: img.naturalWidth, h: img.naturalHeight, done: () => URL.revokeObjectURL(url) });
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('無法解碼圖片')); };
    img.src = url;
  });
}
async function decode(file) {
  try { const b = await createImageBitmap(file, { imageOrientation: 'from-image' }); return { src: b, w: b.width, h: b.height, done: () => b.close && b.close() }; }
  catch (e) { return loadImgEl(file); }
}
async function renderScaled(file, maxSide) {
  const d = await decode(file);
  const scale = Math.min(1, maxSide / Math.max(d.w, d.h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(d.w * scale)); c.height = Math.max(1, Math.round(d.h * scale));
  c.getContext('2d').drawImage(d.src, 0, 0, c.width, c.height);
  d.done();
  return c;
}
async function makeThumb(file) { try { return (await renderScaled(file, 200)).toDataURL('image/jpeg', 0.6); } catch (e) { return null; } }

/* ================= 隱私密碼：個人資料加密存放 =================
 * 用隱私密碼經 PBKDF2（60 萬次）產生金鑰，再用 AES-GCM 加密個人資料。
 * 手機裡只存加密後的內容；密碼和金鑰都不會儲存，只在解鎖期間留在記憶體。 */
const CRYPTO_OK = !!(window.crypto && crypto.subtle && window.TextEncoder);

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealProfile(profile, key, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(profile)));
  return { enc: 1, kdf: 'PBKDF2-SHA256-600000', salt: b64(salt), iv: b64(iv), data: b64(data), filled: isFilled(profile) };
}
async function openProfile(blob, pin) {
  const salt = unb64(blob.salt), key = await deriveKey(pin, salt);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(blob.iv) }, key, unb64(blob.data));
  return { profile: JSON.parse(new TextDecoder().decode(plain)), key, salt };
}
async function persistProfile() {
  const P = { ...S.profile };
  if (S.settings.storeId === false) P.idNumber = '';
  if (S.lock) { S.lock.blob = await sealProfile(P, S.lock.key, S.lock.salt); return store.set(K.profile, S.lock.blob); }
  return store.set(K.profile, P);
}
